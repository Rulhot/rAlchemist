prefix: "<b><gradient:#FF6B35:#FF9A6C><shadow:#3A1F14:1>rAlchemist</shadow></gradient></b> <dark_gray>»</dark_gray>"

no-permission: "{prefix} <white>У тебя нет прав на это."
player-only: "{prefix} <white>Эта команда работает только у игрока."
player-not-found: "{prefix} <white>Игрок <#FF9A6C>{player}</#FF9A6C> не найден."
unknown: "{prefix} <white>Такой команды нет. Список команд: <#FF9A6C>/{command} help."
data-not-loaded: "{prefix} <white>Данные ещё загружаются. Подожди несколько секунд. Если ошибка повторится, напиши администрации."

help:
  - "{prefix} <white>Команды:"
  - " <white>/{command} <dark_gray>»</dark_gray> <white>открыть меню алхимика"
  - " <white>/{command} give [игрок] [тип] [кол-во] <dark_gray>»</dark_gray> <white>выдать эссенцию"
  - " <white>/{command} points [add|set|query] [игрок] ... <dark_gray>»</dark_gray> <white>очки алхимика"
  - " <white>/{command} reload <dark_gray>»</dark_gray> <white>перезагрузить конфигурацию"
  - " <white>/{command} help <dark_gray>»</dark_gray> <white>показать эту справку"

invalid-number: "{prefix} <white>Число <#FF9A6C>{value}</#FF9A6C> не подходит. Введи целое число от 1 до {max}."

give:
  usage:
    - "{prefix} <white>Формат команды: <#FF9A6C>/{command} give [игрок] [тип] [кол-во]"
    - " <white>Типы: <#FF9A6C>time<white>, <#FF9A6C>power<white>, <#FF9A6C>stealth<white>, <#FF9A6C>mystery<white>, <#FF9A6C>eternity"
  sender: "{prefix} <white>Игрок <#FF9A6C>{player}</#FF9A6C> получил: {essence} <gray>x{amount}"
  target: "{prefix} <white>Ты получил: {essence} <gray>x{amount}"
  unavailable: "{prefix} <white>Эта эссенция не настроена. Проверь items.yml."

points:
  usage:
    - "{prefix} <white>Формат команды:"
    - " <#FF9A6C>/{command} points add [игрок] [кол-во] [points|levels]"
    - " <#FF9A6C>/{command} points set [игрок] [кол-во] [points|levels]"
    - " <#FF9A6C>/{command} points query [игрок] [points|levels]"
  add-points: "{prefix} <white>Игрок <#FF9A6C>{player}</#FF9A6C> получил <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  add-levels: "{prefix} <white>Игрок <#FF9A6C>{player}</#FF9A6C> получил <#FF9A6C>{amount}</#FF9A6C> уровней алхимика."
  take-points: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> забрано <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  take-levels: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> забрано <#FF9A6C>{amount}</#FF9A6C> уровней алхимика."
  set-points: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> теперь <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  set-levels: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> теперь <#FF9A6C>{amount}</#FF9A6C> уровень алхимика."
  query-points: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  query-levels: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> <#FF9A6C>{amount}</#FF9A6C> уровень алхимика."
  unknown-level: "{prefix} <white>Уровня <#FF9A6C>{level}</#FF9A6C> нет в levels.yml."

reload:
  usage: "{prefix} <white>Формат команды: <#FF9A6C>/{command} reload"
  done: "{prefix} <white>Конфигурация перезагружена."
  failed: "{prefix} <white>Конфигурация не перезагружена, работает прежняя. Ошибка записана в консоль."
  economy-failed: "{prefix} <white>Новая плата не подключилась, работает прежняя. Ошибка записана в консоль."

mix:
  success: "{prefix} <white>Зелья скрещены за {price}<white>."
  burned: "{prefix} <white>Скрещивание не удалось. Зелья сгорели, потрачено {price}<white>."
  spoiled: "{prefix} <white>Скрещивание не удалось. Вышло испорченное зелье, потрачено {price}<white>."
  too-few: "{prefix} <white>Положи в слоты хотя бы <#FF9A6C>{required}</#FF9A6C> зелья."
  not-potion: "{prefix} <white>В слотах лежат только зелья, по одному в слоте."
  not-positive: "{prefix} <white>Скрещиваются только зелья с положительными эффектами."
  already-crossed: "{prefix} <white>Это зелье уже скрещено. Повторно его не скрестить."
  essence-potion: "{prefix} <white>Зелья после эссенции не скрещиваются."
  different-types: "{prefix} <white>Зелья должны быть одного вида: обычные, взрывные или туманные."
  duplicate-effect: "{prefix} <white>Эффект <#FF9A6C>{effect}</#FF9A6C> уже есть в другом зелье. Убери одно из них."
  incompatible: "{prefix} <white>Эффекты <#FF9A6C>{first}</#FF9A6C> и <#FF9A6C>{second}</#FF9A6C> не совмещаются."
  result-busy: "{prefix} <white>Сначала забери готовое зелье."
  busy: "{prefix} <white>Оплата ещё идёт. Подожди секунду."
  cooldown: "{prefix} <white>Алхимик отдыхает. Подожди ещё <#FF9A6C>{seconds}</#FF9A6C> с."
  daily-limit: "{prefix} <white>Лимит на сегодня исчерпан: <#FF9A6C>{limit}</#FF9A6C> скрещиваний в сутки."
  not-enough-money: "{prefix} <white>Тебе не хватает монет. Скрещивание стоит {price}<white>."
  economy-error: "{prefix} <white>Плата не списана, зелья остались у тебя. Напиши администрации."
  cancelled: "{prefix} <white>Меню закрылось до конца оплаты. Плата возвращена."

price:
  free: "<#8CC77E>бесплатно"
  vault: "<#E6C15A>{amount} ⛃"
  bvault: "<#E6C15A>{amount} ⛃"
  coinsengine: "<#E6C15A>{amount} {currency}"
  playerpoints: "<#8FB8DE>{amount} валюты"

level:
  up: "{prefix} <white>Уровень алхимика вырос до <#FF9A6C>{level}</#FF9A6C>."
  max: "<gray>макс."
  never: "<gray>-"

limits:
  unlimited: "<gray>без лимита"

color:
  default: "<gray>по умолчанию"
  input: "{prefix} <white>Введи <click:suggest_command:'/{command} #'><#FF9A6C>/{command} #RRGGBB</#FF9A6C></click>, например <#FF9A6C>/{command} #FF8800</#FF9A6C>. Нажми на команду, и она появится в чате."
  invalid: "{prefix} <white>Это не цвет в формате #RRGGBB. Цвет не изменён."

config-version: 3 #не трогать!!!
