prefix: "<b><gradient:#FF6B35:#FF9A6C><shadow:#3A1F14:1>rAlchemist</shadow></gradient></b> <dark_gray>»</dark_gray>"

no-permission: "{prefix} <white>Недостаточно прав."
player-only: "{prefix} <white>Эта команда <red>доступна</red> только игроку."
player-not-found: "{prefix} <white>Игрок <#FF9A6C>{player}</#FF9A6C> <red>не найден</red>."
unknown: "{prefix} <white>Неизвестная команда. Список команд: <white>/{command} help."
data-not-loaded: "{prefix} <white>Данные ещё загружаются. Попробуйте через несколько секунд, а если не поможет - сообщите администрации."

help:
  - "{prefix} <white>Команды алхимика:"
  - " <white>/{command} <dark_gray>-</dark_gray> <white>открыть меню алхимика"
  - " <white>/{command} give [игрок] [тип] [кол-во] <dark_gray>-</dark_gray> <white>выдать эссенцию"
  - " <white>/{command} points [add|set|query] [игрок] ... <dark_gray>-</dark_gray> <white>очки алхимика"
  - " <white>/{command} reload <dark_gray>-</dark_gray> <white>перезагрузить конфигурацию"
  - " <white>/{command} help <dark_gray>-</dark_gray> <white>показать эту справку"

invalid-number: "{prefix} <white>Число <#FF9A6C>{value}</#FF9A6C> <red>не подходит</red>: нужно целое от 1 до {max}."

give:
  usage:
    - "{prefix} <white>Использование: <white>/{command} give [игрок] [тип] [кол-во]"
    - " <white>Типы: <#FF9A6C>time<white>, <#FF9A6C>power<white>, <#FF9A6C>stealth<white>, <#FF9A6C>mystery<white>, <#FF9A6C>eternity"
  sender: "{prefix} <white>Игроку <#FF9A6C>{player}</#FF9A6C> <green>выдано</green>: {essence} <gray>x{amount}"
  target: "{prefix} <white>Вы <green>получили</green>: {essence} <gray>x{amount}"
  unavailable: "{prefix} <white>Эссенция <red>не настроена</red>, проверьте items.yml."

points:
  usage:
    - "{prefix} <white>Использование:"
    - " <white>/{command} points add [игрок] [кол-во] [points|levels]"
    - " <white>/{command} points set [игрок] [кол-во] [points|levels]"
    - " <white>/{command} points query [игрок] [points|levels]"
  add-points: "{prefix} <white>Выдано <#FF9A6C>{amount}</#FF9A6C> очков алхимика игроку <#FF9A6C>{player}</#FF9A6C>."
  add-levels: "{prefix} <white>Выдано <#FF9A6C>{amount}</#FF9A6C> уровней алхимика игроку <#FF9A6C>{player}</#FF9A6C>."
  take-points: "{prefix} <white>Забрано <#FF9A6C>{amount}</#FF9A6C> очков алхимика у игрока <#FF9A6C>{player}</#FF9A6C>."
  take-levels: "{prefix} <white>Забрано <#FF9A6C>{amount}</#FF9A6C> уровней алхимика у игрока <#FF9A6C>{player}</#FF9A6C>."
  set-points: "{prefix} <white>Игроку <#FF9A6C>{player}</#FF9A6C> установлено <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  set-levels: "{prefix} <white>Игроку <#FF9A6C>{player}</#FF9A6C> установлен <#FF9A6C>{amount}</#FF9A6C> уровень алхимика."
  query-points: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> <#FF9A6C>{amount}</#FF9A6C> очков алхимика."
  query-levels: "{prefix} <white>У игрока <#FF9A6C>{player}</#FF9A6C> <#FF9A6C>{amount}</#FF9A6C> уровень алхимика."
  unknown-level: "{prefix} <white>Уровня <#FF9A6C>{level}</#FF9A6C> <red>нет</red> в levels.yml."

reload:
  usage: "{prefix} <white>Использование: <white>/{command} reload"
  done: "{prefix} <white>Конфигурация <green>перезагружена</green>."
  economy-failed: "{prefix} <white>Новую плату подключить <red>не удалось</red>, работает прежняя. Подробности в консоли."

mix:
  success: "{prefix} <white>Зелья <green>скрещены</green> за {price}<white>."
  burned: "{prefix} <white>Скрещивание <red>не удалось</red>: зелья сгорели. Потрачено {price}<white>."
  spoiled: "{prefix} <white>Скрещивание <red>не удалось</red>: получилось испорченное зелье. Потрачено {price}<white>."
  too-few: "{prefix} <white>Положите минимум <#FF9A6C>{required}</#FF9A6C> зелья в слоты для скрещивания."
  not-potion: "{prefix} <white>В слотах должны лежать <red>только</red> зелья, по одному в слоте."
  not-positive: "{prefix} <white>Скрещивать можно <red>только</red> положительные зелья с эффектами."
  already-crossed: "{prefix} <white>Скрещенное зелье <red>нельзя</red> скрестить повторно."
  essence-potion: "{prefix} <white>Зелья, обработанные эссенцией, скрещивать <red>нельзя</red>."
  different-types: "{prefix} <white>Зелья должны быть одного вида: обычные, взрывные или туманные."
  duplicate-effect: "{prefix} <white>Эффект <#FF9A6C>{effect}</#FF9A6C> уже есть в другом зелье, одинаковые класть <red>нельзя</red>."
  incompatible: "{prefix} <white>Эффекты <#FF9A6C>{first}</#FF9A6C> и <#FF9A6C>{second}</#FF9A6C> <red>нельзя</red> совмещать."
  result-busy: "{prefix} <white>Сначала заберите готовое зелье."
  cooldown: "{prefix} <white>Алхимик отдыхает, подождите ещё <#FF9A6C>{seconds}</#FF9A6C> с."
  daily-limit: "{prefix} <white>На сегодня лимит <red>исчерпан</red>: <#FF9A6C>{limit}</#FF9A6C> скрещиваний в сутки."
  not-enough-money: "{prefix} <white>Не <red>хватает</red> средств: скрещивание стоит {price}<white>."
  economy-error: "{prefix} <white>Не <red>удалось</red> списать плату, зелья остались у вас. Сообщите администрации."

price:
  free: "<#8CC77E>бесплатно"
  vault: "<#E6C15A>{amount} ⛃"
  coinsengine: "<#E6C15A>{amount} {currency}"
  playerpoints: "<#8FB8DE>{amount} валюта."

level:
  up: "{prefix} <white>Уровень алхимика <green>повышен</green> до <#FF9A6C>{level}</#FF9A6C>."
  max: "<gray>макс."
  never: "<gray>-"

limits:
  unlimited: "<gray>без лимита"

color:
  default: "<gray>по умолчанию"
  input: "{prefix} <white>Введите команду <click:suggest_command:'/alchemist #'><#FF9A6C>/{command} #RRGGBB</#FF9A6C></click>, например <#FF9A6C>/{command} #FF8800</#FF9A6C>. Нажмите на команду, чтобы подставить её в чат."
  invalid: "{prefix} <white>Это <red>не похоже</red> на цвет в формате #RRGGBB, цвет не изменён."

config-version: 1 #не трогать!!!
