settings:
  debug: false # подробные логи для поиска проблем
  metrics: true
  update-check: true

command:
  main: alchemist
  aliases: [ alchemy ]

price:
  # плата за скрещивание, блоков с provider бывает несколько, списываются все
  costs:
    - provider: VAULT # VAULT, BVAULT, COINSENGINE, PLAYERPOINTS
      currency: money # COINSENGINE: id валюты, BVAULT: имя счёта (обычный счёт vault)
      base: 3000 # базовая цена
      per-potion: 0 # доплата за каждое зелье
      per-effect: 250 # доплата за каждый эффект в результате

sounds:
  click:
    key: "minecraft:ui.button.click"
    volume: 0.5
    pitch: 1.0
  mix-success:
    key: "minecraft:block.brewing_stand.brew"
    volume: 1.0
    pitch: 1.0
  mix-fail:
    key: "minecraft:block.note_block.bass"
    volume: 1.0
    pitch: 1.0

config-version: 3 #не трогать!!!
