settings:
  debug: false
  metrics: true
  update-check: true # сообщать в консоль о новой версии плагина

command:
  main: alchemist
  aliases: [ alchemy ]

# Плата за скрещивание. Можно несколько сразу: добавьте ещё один блок "- provider: ..."
# provider: VAULT, BVAULT, COINSENGINE, PLAYERPOINTS
# currency: для COINSENGINE - ID валюты, для BVAULT - название счёта (обычный счёт называется vault).
# Для VAULT и PLAYERPOINTS currency не используется
price:
  costs:
    - provider: VAULT
      currency: money
      base: 3000 # базовая цена
      per-potion: 0 # доплата за каждое зелье
      per-effect: 250 # доплата за каждый эффект в результате

sounds:
  click:
    key: "minecraft:ui.button.click"
    volume: 0.5
    pitch: 1.0
  mix-success:
    key: "minecraft:block.brewing_stand.brew"
    volume: 1.0
    pitch: 1.0
  mix-fail:
    key: "minecraft:block.note_block.bass"
    volume: 1.0
    pitch: 1.0

config-version: 2 #не трогать!!!
