min-potions: 2 # минимум зелий для скрещивания
allow-crossed: false # скрещивать ли уже скрещенные зелья
allow-duplicates: false # класть ли зелья с одинаковым эффектом
combine-essences: false # накладывать ли эссенции на скрещенные зелья и наоборот
# эффекты из одной группы не совмещаются, названия как в /effect
incompatible:
  - [strength, resistance]
  - [regeneration, instant_health]

# шанс неудачи в % = base-chance + chance-per-effect * число эффектов, не больше max-chance
failure:
  mode: SPOIL # BURN: зелья сгорают, SPOIL: выходит испорченное зелье
  base-chance: 0
  chance-per-effect: 5
  max-chance: 50

limits:
  cooldown-seconds: 0 # 0 без паузы
  daily-mixes: 0 # скрещиваний в сутки, 0 без лимита
  # свои лимиты по праву ralchemist.limits.<имя>, при нескольких правах берётся лучшее
  groups:
    vip:
      cooldown-seconds: 0
      daily-mixes: 0

config-version: 2 #не трогать!!!
